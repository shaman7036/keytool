name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Build
        run: make clean && make CFLAGS="-O2 -Wall -Wextra -Werror"

      - name: Smoke test (no device needed)
        run: |
          set +e
          out=$(./stkeytool 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 2
          grep -q "usage: stkeytool" <<<"$out"
          test -z "$(ldd ./stkeytool | grep 'not found')"
          file ./stkeytool | grep -q "x86-64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stkeytool-linux-x86_64
          path: |
            stkeytool
            README.md
            70-stm32key.rules
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: stkeytool-linux-x86_64
          path: dist

      - name: Package
        run: |
          chmod +x dist/stkeytool
          tar -czf "stkeytool-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" \
            -C dist stkeytool README.md 70-stm32key.rules

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: stkeytool-linux-x86_64-${{ github.ref_name }}.tar.gz
